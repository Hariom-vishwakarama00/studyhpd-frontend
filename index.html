/* Brand splash for the Android app's first paint (shown only when boot.js adds .app-boot). Matches the native splash. */
#boot-splash{display:none}
.app-boot #boot-splash{display:flex;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;background:#4f46e5;color:#fff;pointer-events:none;font-family:Poppins,ui-sans-serif,system-ui,Roboto,"Segoe UI",Arial,sans-serif;text-align:center;transition:opacity .25s ease,visibility 0s linear .25s;animation:bs-out .3s ease 6s forwards}
.app-boot.booted #boot-splash{opacity:0;visibility:hidden}
.app-boot{background:#4f46e5}
.app-boot.booted{background:none}
#boot-splash .bs-in{width:300px;height:330px;padding-top:18px;box-sizing:border-box}
#boot-splash .bs-tile{width:132px;height:132px;margin:0 auto;border-radius:32px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(20,12,90,.35)}
#boot-splash .bs-tile img{width:100px;height:auto;display:block}
#boot-splash .bs-name{margin-top:18px;font-size:36px;line-height:1.15;font-weight:700;letter-spacing:-.2px}
#boot-splash .bs-tag{margin-top:6px;font-size:15px;font-weight:500;color:#e0e7ff}
#boot-splash .bs-dot{width:22px;height:22px;margin:26px auto 0;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes bs-out{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#boot-splash .bs-dot{animation:none}}
</style>
